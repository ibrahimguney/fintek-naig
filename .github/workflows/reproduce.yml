name: Reproduce analyses

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_all.py
      - name: Upload reproducibility outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-reproducibility
          path: |
            data/raw/wdi_2021.csv
            data/raw/wgi_2021.csv
            data/processed/cbdc_extended_2021.csv
            outputs/tables/
            outputs/figures/
            outputs/phase2_results_summary.md
            outputs/phase2_xgboost_summary.json
